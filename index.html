<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        ::root{
            --my-nav-width: 30%;
        }
        *{
            box-sizing: border-box;
            margin: 0;
        }
        body{
            display: flex;
            flex-wrap: wrap;
        
        }
        header{
            width: 100%;
            height: 10vh; /*vhは画面に占めるパーセント*/
            background-color: aquamarine;
        }
           {header
        background-color: aquamarine;
    }
    {nav
        width: var(--my-nav-width);
        height: 80vh;
        background-color: blantiquewhite;
        }
    {main
        width: calc( 100%-var(--my-nav-width) );
        height: 80vh;
        background-color: blanchedalmond;
        }
    {footer
        width: 100px;
        height: 10vh;
        background-color: brown;
        }
    </style>
</head>
<body>
    <header>
        <div>ヘッダー</div>

    </header>
    
    <nav>
        なぶ
    </nav>

    <main>
        メイン
    </main>

    <footer>
        ふったー
    </footer>
        
</body>

</html>
